<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e1e2e">
<link rel="manifest" href="/manifest.json">
<title>Noosphere</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --bg: #1e1e2e;
    --surface: #252536;
    --card: #2a2a3c;
    --text: #cdd6f4;
    --subtext: #a6adc8;
    --dim: #6c7086;
    --border: #45475a;
    --mauve: #cba6f7;
    --pink: #f5c2e7;
    --peach: #fab387;
    --green: #a6e3a1;
    --blue: #89b4fa;
    --yellow: #f9e2af;
    --red: #f38ba8;
    --teal: #94e2d5;
    --lavender: #b4befe;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier Prime', monospace;
    font-size: 17px;
    line-height: 1.7;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .layout { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 24px 16px; position: fixed; top: 0; left: -220px;
    height: 100vh; max-height: 100vh; overflow-y: auto; transition: left 0.3s ease;
    z-index: 100;
  }
  .sidebar.open { left: 0; }
  .sidebar-title {
    font-family: 'EB Garamond', serif; font-size: 18px; font-weight: 600;
    color: var(--mauve); letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 24px;
  }
  .sidebar-section {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--dim); margin: 16px 0 8px;
  }
  .sidebar-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13px; color: var(--subtext); transition: background 0.15s;
    margin-bottom: 2px;
  }
  .sidebar-item:hover { background: var(--card); color: var(--text); }
  .sidebar-item.active { background: var(--card); color: var(--mauve); }
  .sidebar-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sidebar-search { margin-bottom: 16px; }
  .sidebar-search input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: 'Courier Prime', monospace; font-size: 12px;
    padding: 8px 10px; border-radius: 8px; outline: none; transition: border-color 0.2s;
  }
  .sidebar-search input::placeholder { color: var(--dim); }
  .sidebar-search input:focus { border-color: var(--mauve); }
  .search-error { font-size: 10px; color: var(--red); margin-top: 4px; }
  .sidebar-overlay {
    display: none; position: fixed; inset: 0; background: transparent;
    z-index: 99;
  }
  .sidebar-overlay.show { display: block; }

  /* Menu toggle button */
  .menu-btn {
    position: fixed; top: 16px; left: 16px; z-index: 101;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--subtext); border-radius: 8px; padding: 8px 10px;
    cursor: pointer; font-size: 16px; line-height: 1;
    display: none; /* hidden on mobile by default, shown via JS */
    transition: opacity 0.2s;
  }
  .menu-btn:hover { color: var(--text); }

  .feed { max-width: 740px; margin: 0 auto; padding: 20px 16px 60px; }

  .menu-btn { display: block; }

  /* Desktop: feed always centered, sidebar overlays */
  @media (min-width: 900px) {
    .sidebar { z-index: 100; }
    .sidebar-overlay { display: none; }
    .sidebar-overlay.show { display: block !important; }
    .feed { max-width: 780px; margin: 0 auto; padding: 20px 32px 60px; }
    .menu-btn { left: 16px; z-index: 101; }
  }

  .header {
    text-align: center;
    padding: 30px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .header h1 {
    font-family: 'EB Garamond', serif;
    font-size: 42px; font-weight: 600;
    color: var(--mauve);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .header .date { font-size: 16px; color: var(--dim); letter-spacing: 1px; }

  /* Base card */
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .card-label {
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .card-time { font-size: 12px; color: var(--dim); margin-left: auto; letter-spacing: 0; text-transform: none; }
  .card-title {
    font-family: 'EB Garamond', serif;
    font-size: 24px; font-weight: 600; margin-bottom: 10px; line-height: 1.3;
  }
  .card-body { color: var(--subtext); font-size: 16px; line-height: 1.8; }
  .card-body em { color: var(--text); font-style: italic; }
  .card-body strong { color: var(--text); }
  .card-footer { margin-top: 14px; font-size: 13px; color: var(--dim); }

  /* Weather */
  .card-weather { border-top: 3px solid var(--peach); background: linear-gradient(180deg, #2e2a3a 0%, var(--card) 100%); }
  .card-weather .card-label { color: var(--peach); }
  .card-weather .card-body { font-family: 'EB Garamond', serif; font-size: 20px; font-style: italic; color: var(--text); line-height: 1.8; }
  .temp { display: inline-block; background: var(--surface); padding: 3px 10px; border-radius: 4px; font-family: 'Courier Prime', monospace; font-style: normal; font-size: 15px; color: var(--peach); }

  /* Wittgenstein */
  .card-wittgenstein { background: var(--bg); border: 1px solid var(--dim); }
  .card-wittgenstein .card-label { color: var(--lavender); }
  .proposition { font-family: 'EB Garamond', serif; font-size: 22px; color: var(--text); padding: 18px 0; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .prop-number { font-family: 'Courier Prime', monospace; font-size: 15px; color: var(--lavender); margin-right: 8px; }
  .commentary { font-size: 15px; color: var(--subtext); line-height: 1.8; }

  /* Russian */
  .card-russian { border-left: 3px solid var(--blue); }
  .card-russian .card-label { color: var(--blue); }
  .russian-text { font-size: 22px; color: var(--text); margin-bottom: 10px; line-height: 1.6; }
  .transliteration { font-size: 14px; color: var(--dim); font-style: italic; margin-bottom: 14px; }
  .breakdown { font-size: 15px; color: var(--subtext); line-height: 1.8; }
  .source { font-size: 13px; color: var(--dim); margin-top: 10px; font-style: italic; }

  /* Untranslatable */
  .card-untranslatable { text-align: center; border-top: 3px solid var(--teal); }
  .card-untranslatable .card-label { color: var(--teal); justify-content: center; }
  .word { font-size: 38px; font-weight: 600; color: var(--teal); margin: 18px 0 6px; font-family: 'EB Garamond', serif; }
  .language { font-size: 14px; color: var(--dim); margin-bottom: 18px; letter-spacing: 1px; }
  .card-untranslatable .card-body { text-align: left; }
  .question { text-align: center; font-style: italic; color: var(--teal); font-size: 15px; margin-top: 14px; }

  /* Penny Red */
  .card-penny-red { border-left: 3px solid var(--yellow); }
  .card-penny-red .card-label { color: var(--yellow); }
  .place-names { font-family: 'EB Garamond', serif; font-size: 24px; color: var(--text); margin-bottom: 6px; }
  .arrow { color: var(--yellow); margin: 0 8px; }
  .old-name { color: var(--dim); text-decoration: line-through; }
  .coordinates { font-size: 13px; color: var(--dim); margin-bottom: 14px; font-family: 'Courier Prime', monospace; }

  /* Git log */
  .card-git { background: #1a1a2a; border: 1px solid var(--border); font-family: 'Courier Prime', monospace; }
  .card-git .card-label { color: var(--green); }
  .commit { font-size: 15px; padding: 8px 0; border-bottom: 1px solid #252536; }
  .commit:last-child { border-bottom: none; }
  .hash { color: var(--yellow); font-size: 14px; margin-right: 8px; }
  .commit .msg { color: var(--subtext); font-size: 14px; }
  .repo { color: var(--green); font-size: 13px; }

  /* Apophenia */
  .card-apophenia { border-top: 3px solid var(--pink); }
  .card-apophenia .card-label { color: var(--pink); }
  .pair { display: flex; gap: 12px; margin-bottom: 12px; }
  .pair-item { flex: 1; background: var(--surface); border-radius: 8px; padding: 18px; font-size: 15px; line-height: 1.7; }
  .item-type { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin-bottom: 8px; }
  .prompt { text-align: center; color: var(--pink); font-style: italic; font-family: 'EB Garamond', serif; font-size: 18px; }

  /* Midnight Postcard */
  .card-postcard { padding: 0; overflow: hidden; border: none; border-radius: 12px; }
  .card-postcard .card-label { color: var(--mauve); padding: 16px 20px 0; background: var(--card); }
  .card-postcard img { width: 100%; display: block; }
  .card-postcard .image-placeholder { width: 100%; height: 280px; background: linear-gradient(135deg, #2a1a3a 0%, #1a2a3a 50%, #2a2a1a 100%); display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 13px; font-style: italic; }

  /* Dead Medium */
  .card-dead-medium { background: linear-gradient(180deg, #2c2a36 0%, var(--card) 100%); border-top: 3px solid var(--red); }
  .card-dead-medium .card-label { color: var(--red); }
  .medium-name { font-family: 'EB Garamond', serif; font-size: 26px; color: var(--text); margin-bottom: 6px; }
  .dates { font-size: 14px; color: var(--dim); margin-bottom: 14px; }

  /* The Diff */
  .card-diff { border-top: 3px solid var(--green); }
  .card-diff .card-label { color: var(--green); }
  .translations { display: flex; gap: 12px; margin-bottom: 12px; }
  .translation { flex: 1; background: var(--surface); border-radius: 8px; padding: 18px; font-family: 'EB Garamond', serif; font-size: 17px; line-height: 1.7; color: var(--text); }
  .translator { font-family: 'Courier Prime', monospace; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
  .analysis { font-size: 15px; color: var(--subtext); line-height: 1.8; }
  .highlight { background: rgba(166, 227, 161, 0.15); padding: 1px 4px; border-radius: 2px; }

  /* Typeface */
  .card-typeface { border-left: 3px solid var(--mauve); }
  .card-typeface .card-label { color: var(--mauve); }
  .specimen { font-size: 42px; color: var(--text); margin: 14px 0; line-height: 1.2; }
  .meta-line { font-size: 14px; color: var(--dim); margin-bottom: 14px; }

  /* Recipe */
  .card-recipe { border-top: 3px solid var(--green); background: linear-gradient(180deg, #262a36 0%, var(--card) 100%); }
  .card-recipe .card-label { color: var(--green); }
  .dish-name { font-family: 'EB Garamond', serif; font-size: 26px; color: var(--text); margin-bottom: 6px; }
  .etymology { font-size: 14px; color: var(--teal); font-style: italic; margin-bottom: 14px; padding: 10px 14px; background: var(--surface); border-radius: 6px; }

  /* Entropy Garden */
  .card-entropy { background: var(--bg); border: 1px solid var(--border); padding: 0; overflow: hidden; }
  .card-entropy .card-label { color: var(--green); padding: 20px 28px 0; }
  .card-entropy canvas { width: 100%; display: block; image-rendering: pixelated; }
  .card-entropy .entropy-meta {
    padding: 12px 28px 20px; font-size: 11px; color: var(--dim);
    font-family: 'Courier Prime', monospace; letter-spacing: 0.5px;
  }

  /* Annotation Layer */
  .card-annotation { border-left: 3px solid var(--yellow); }
  .card-annotation .card-label { color: var(--yellow); }
  .card-annotation .source-text {
    font-family: 'EB Garamond', serif; font-size: 19px; color: var(--text);
    line-height: 2.2; margin-bottom: 16px; position: relative;
  }
  .card-annotation .source-text .annotated {
    border-bottom: 1px dotted var(--yellow); cursor: help;
    transition: color 0.15s;
  }
  .card-annotation .source-text .annotated:hover { color: var(--yellow); }
  .card-annotation .annotations {
    border-top: 1px solid var(--border); padding-top: 14px;
  }
  .card-annotation .annotation {
    font-size: 14px; color: var(--subtext); line-height: 1.7;
    margin-bottom: 10px; padding-left: 16px; border-left: 2px solid var(--border);
  }
  .card-annotation .annotation .ann-marker {
    color: var(--yellow); font-weight: 700; font-size: 12px; margin-right: 6px;
    font-family: 'Courier Prime', monospace;
  }
  .card-annotation .source-meta {
    font-size: 13px; color: var(--dim); font-style: italic; margin-top: 14px;
  }

  /* Corpus Surprise */
  .card-corpus { border-top: 3px solid var(--lavender); }
  .card-corpus .card-label { color: var(--lavender); }
  .card-corpus .corpus-sentence {
    font-family: 'EB Garamond', serif; font-size: 22px; color: var(--text);
    line-height: 1.7; margin-bottom: 14px; padding: 16px 0;
  }
  .card-corpus .corpus-meta {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
  }
  .card-corpus .corpus-tag {
    font-size: 11px; padding: 4px 10px; border-radius: 4px;
    background: var(--surface); color: var(--dim);
    font-family: 'Courier Prime', monospace; letter-spacing: 0.5px;
  }
  .card-corpus .corpus-tag.register { color: var(--lavender); }
  .card-corpus .corpus-tag.year { color: var(--peach); }
  .card-corpus .corpus-tag.source { color: var(--teal); }

  /* Music Rec */
  .card-music-rec { border-top: 3px solid var(--flamingo); }
  .card-music-rec .card-label { color: var(--flamingo); }
  .card-music-rec .music-rec-title {
    font-family: 'EB Garamond', serif; font-size: 22px; color: var(--text);
    font-weight: 600; margin-bottom: 4px;
  }
  .card-music-rec .music-rec-artist {
    font-size: 16px; color: var(--flamingo); margin-bottom: 4px;
  }
  .card-music-rec .music-rec-album {
    font-size: 13px; color: var(--dim); margin-bottom: 14px;
  }
  .card-music-rec .music-rec-link {
    display: inline-block; margin-top: 12px; padding: 6px 14px;
    background: var(--surface); color: var(--flamingo); border-radius: 6px;
    text-decoration: none; font-size: 13px; transition: background 0.2s;
  }
  .card-music-rec .music-rec-link:hover { background: var(--border); }

  /* Monthly Playlist */
  .card-monthly-playlist { border-top: 3px solid var(--mauve); }
  .card-monthly-playlist .card-label { color: var(--mauve); }
  .card-monthly-playlist .playlist-title {
    font-family: 'EB Garamond', serif; font-size: 24px; color: var(--text);
    font-weight: 600; margin-bottom: 6px;
  }
  .card-monthly-playlist .playlist-desc {
    font-size: 15px; color: var(--subtext); margin-bottom: 16px;
    line-height: 1.6; font-style: italic;
  }
  .card-monthly-playlist .playlist-stats {
    font-size: 13px; color: var(--dim); margin-bottom: 14px;
  }
  .card-monthly-playlist .playlist-tracks {
    list-style: none; padding: 0; margin: 0 0 16px 0;
  }
  .card-monthly-playlist .playlist-tracks li {
    padding: 6px 0; border-bottom: 1px solid var(--border);
    font-size: 14px; color: var(--subtext);
  }
  .card-monthly-playlist .playlist-tracks li:last-child { border-bottom: none; }
  .card-monthly-playlist .playlist-tracks .track-name { color: var(--text); }
  .card-monthly-playlist .playlist-tracks .track-artist { color: var(--mauve); }
  .card-monthly-playlist .playlist-tracks .track-badge {
    font-size: 10px; padding: 1px 6px; border-radius: 3px;
    background: var(--surface); color: var(--dim); margin-left: 6px;
  }
  .card-monthly-playlist .playlist-link {
    display: inline-block; margin-top: 8px; padding: 8px 18px;
    background: var(--surface); color: var(--mauve); border-radius: 6px;
    text-decoration: none; font-size: 14px; font-weight: 600;
    transition: background 0.2s;
  }
  .card-monthly-playlist .playlist-link:hover { background: var(--border); }

  /* Time separators */
  .time-separator {
    text-align: center; padding: 28px 0; font-size: 15px;
    color: var(--dim); letter-spacing: 3px; text-transform: uppercase;
    font-weight: 600;
  }

  /* Empty state */
  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--dim); font-style: italic;
  }

  /* Pull to refresh indicator */
  .refreshing { text-align: center; padding: 12px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>

<button class="menu-btn" id="menuBtn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-title">Noosphere</div>

  <div class="sidebar-search">
    <input type="text" id="searchInput" placeholder="search (regex ok)" oninput="searchFeed(this.value)">
  </div>

  <div class="sidebar-section">Feed</div>
  <div class="sidebar-item active" onclick="filterFeed(null)">
    <span class="sidebar-dot" style="background: var(--mauve)"></span> All
  </div>

  <div class="sidebar-section">Morning</div>
  <div class="sidebar-item" onclick="filterFeed('weather')">
    <span class="sidebar-dot" style="background: var(--peach)"></span> Weather
  </div>
  <div class="sidebar-item" onclick="filterFeed('wittgenstein')">
    <span class="sidebar-dot" style="background: var(--lavender)"></span> Wittgenstein
  </div>
  <div class="sidebar-item" onclick="filterFeed('russian')">
    <span class="sidebar-dot" style="background: var(--blue)"></span> Русский Час
  </div>

  <div class="sidebar-section">Midday</div>
  <div class="sidebar-item" onclick="filterFeed('penny_red')">
    <span class="sidebar-dot" style="background: var(--yellow)"></span> Penny Red
  </div>
  <div class="sidebar-item" onclick="filterFeed('git_log')">
    <span class="sidebar-dot" style="background: var(--green)"></span> git log
  </div>

  <div class="sidebar-section">Afternoon</div>
  <div class="sidebar-item" onclick="filterFeed('untranslatable')">
    <span class="sidebar-dot" style="background: var(--teal)"></span> Untranslatable
  </div>
  <div class="sidebar-item" onclick="filterFeed('apophenia')">
    <span class="sidebar-dot" style="background: var(--pink)"></span> Apophenia
  </div>
  <div class="sidebar-item" onclick="filterFeed('corpus_surprise')">
    <span class="sidebar-dot" style="background: var(--lavender)"></span> Corpus
  </div>
  <div class="sidebar-item" onclick="filterFeed('annotation')">
    <span class="sidebar-dot" style="background: var(--yellow)"></span> Annotation
  </div>
  <div class="sidebar-item" onclick="filterFeed('music_rec')">
    <span class="sidebar-dot" style="background: var(--flamingo)"></span> Music Rec
  </div>

  <div class="sidebar-section">Weekly</div>
  <div class="sidebar-item" onclick="filterFeed('the_diff')">
    <span class="sidebar-dot" style="background: var(--green)"></span> The Diff
  </div>
  <div class="sidebar-item" onclick="filterFeed('dead_medium')">
    <span class="sidebar-dot" style="background: var(--red)"></span> Dead Medium
  </div>
  <div class="sidebar-item" onclick="filterFeed('typeface')">
    <span class="sidebar-dot" style="background: var(--mauve)"></span> Typeface
  </div>
  <div class="sidebar-item" onclick="filterFeed('recipe')">
    <span class="sidebar-dot" style="background: var(--green)"></span> Recipe
  </div>

  <div class="sidebar-section">Monthly</div>
  <div class="sidebar-item" onclick="filterFeed('monthly_playlist')">
    <span class="sidebar-dot" style="background: var(--mauve)"></span> Playlist
  </div>

  <div class="sidebar-section">Night</div>
  <div class="sidebar-item" onclick="filterFeed('entropy_garden')">
    <span class="sidebar-dot" style="background: var(--green)"></span> Entropy Garden
  </div>
  <div class="sidebar-item" onclick="filterFeed('postcard')">
    <span class="sidebar-dot" style="background: var(--mauve)"></span> Postcard
  </div>
</div>

<div class="feed" id="feed">
  <div class="header">
    <h1>Noosphere</h1>
    <div class="date" id="date"></div>
  </div>
  <div id="cards"></div>
</div>

<script>
// Convert markdown bold/italic to HTML (in case generators slip through markdown)
function md2html(text) {
  if (!text) return '';
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

const CARD_RENDERERS = {
  weather: (item) => `
    <div class="card card-weather">
      <div class="card-label">☁ Weather <span class="card-time">${formatTime(item.timestamp)}</span></div>
      <div class="card-body">${item.content}</div>
    </div>`,

  wittgenstein: (item) => `
    <div class="card card-wittgenstein">
      <div class="card-label">◇ Wittgenstein's Ladder <span class="card-time">${formatTime(item.timestamp)}</span></div>
      <div class="proposition"><span class="prop-number">${item.number || ''}</span>${item.proposition || ''}</div>
      <div class="commentary">${md2html(item.commentary)}</div>
    </div>`,

  russian: (item) => `
    <div class="card card-russian">
      <div class="card-label">🇷🇺 Русский Час <span class="card-time">${formatTime(item.timestamp)}</span></div>

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}

function formatDate(d) {
  return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function groupByDay(items) {
  const groups = {};
  for (const item of items) {
    const day = new Date(item.timestamp).toLocaleDateString('en-US');
    if (!groups[day]) groups[day] = [];
    groups[day].push(item);
  }
  return groups;
}

function groupByTimeOfDay(items) {
  const morning = [], midday = [], afternoon = [], evening = [];
  for (const item of items) {
    const h = new Date(item.timestamp).getHours();
    if (h < 11) morning.push(item);
    else if (h < 14) midday.push(item);
    else if (h < 18) afternoon.push(item);
    else evening.push(item);
  }
  return { morning, midday, afternoon, evening };
}

async function loadFeed() {
  try {
    const res = await fetch('/api/feed?limit=50');
    const data = await res.json();
    renderFeed(data.items);
  } catch (err) {
    document.getElementById('cards').innerHTML = '<div class="empty">Could not load feed</div>';
  }
}

function renderCard(item) {
  const renderer = CARD_RENDERERS[item.type];
  if (renderer) return renderer(item);
  return `
    <div class="card">
      <div class="card-label">${item.type || 'unknown'} <span class="card-time">${formatTime(item.timestamp)}</span></div>
      <div class="card-body">${item.content || JSON.stringify(item)}</div>
    </div>`;
}

function renderFeed(items) {
  const container = document.getElementById('cards');

  if (!items || items.length === 0) {
    container.innerHTML = '<div class="empty">Nothing here yet. The noosphere is quiet.</div>';
    return;
  }

  let html = '';
  const todayStr = new Date().toLocaleDateString('en-US');

  const todayItems = [];
  const olderItems = [];
  for (const item of items) {
    if (new Date(item.timestamp).toLocaleDateString('en-US') === todayStr) {
      todayItems.push(item);
    } else {
      olderItems.push(item);
    }
  }

  // Today: newest first, like a timeline
  if (todayItems.length > 0) {
    html += `<div class="time-separator">Today</div>`;
    todayItems.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    for (const item of todayItems) {
      html += renderCard(item);
    }
  }

  // Older days: group by day, then time-of-day within each day
  const days = groupByDay(olderItems);
  const sortedDays = Object.keys(days).sort((a, b) => new Date(b) - new Date(a));
  for (const dayStr of sortedDays) {
    html += `<div class="time-separator">${formatDate(new Date(dayStr))}</div>`;
    const dayItems = days[dayStr];
    const grouped = groupByTimeOfDay(dayItems);
    for (const [label, sectionItems] of [['Morning', grouped.morning], ['Midday', grouped.midday], ['Afternoon', grouped.afternoon], ['Evening', grouped.evening]]) {
      if (sectionItems.length === 0) continue;
      if (dayItems.length > 4) {
        html += `<div style="color:var(--dim);font-size:12px;text-align:center;padding:8px 0;letter-spacing:2px;text-transform:uppercase">${label}</div>`;
      }
      for (const item of sectionItems) {
        html += renderCard(item);
      }
    }
  }

  container.innerHTML = html;
}

let allItems = [];
let activeFilter = null;
let searchQuery = '';

function searchFeed(query) {
  searchQuery = query;
  applyFilters();
}

function applyFilters() {
  let items = allItems;

  // Type filter
  if (activeFilter) {
    items = items.filter(i => i.type === activeFilter);
  }

  // Search filter (regex)
  if (searchQuery.trim()) {
    try {
      const re = new RegExp(searchQuery, 'i');
      items = items.filter(item => {
        const text = JSON.stringify(item);
        return re.test(text);
      });
      // Clear any error styling
      document.getElementById('searchInput').style.borderColor = '';
    } catch (e) {
      // Invalid regex — show red border, don't filter
      document.getElementById('searchInput').style.borderColor = 'var(--red)';
      return;
    }
  }

  renderFeed(items);
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const isOpen = sidebar.classList.contains('open') || sidebar.style.left === '0px';

  if (isOpen) {
    sidebar.classList.remove('open');
    sidebar.style.left = '-220px';
    overlay.classList.remove('show');
  } else {
    sidebar.classList.add('open');
    sidebar.style.left = '0px';
    overlay.classList.add('show');
  }
}

function filterFeed(type) {
  activeFilter = type;

  // Update active state in sidebar
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');

  // Re-render with filters
  applyFilters();

  // Close sidebar on mobile
  if (window.innerWidth < 900) toggleSidebar();
}

async function loadFeed() {
  try {
    const res = await fetch('/api/feed?limit=50');
    const data = await res.json();
    allItems = data.items;
    applyFilters();
  } catch (err) {
    document.getElementById('cards').innerHTML = '<div class="empty">Could not load feed</div>';
  }
}

// === Entropy Garden Generators ===
const GARDEN_COLORS = {
  bg: '#1e1e2e', growth: '#a6e3a1', glow: '#94e2d5', accent: '#cba6f7', dim: '#45475a'
};

function initEntropyGarden(id, algo, seed) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = GARDEN_COLORS.bg;
  ctx.fillRect(0, 0, W, H);

  // Simple seeded RNG
  let s = seed;
  const rng = () => { s = (s * 1664525 + 1013904223) & 0xFFFFFFFF; return (s >>> 0) / 0xFFFFFFFF; };

  const generators = { dla, flow_field, cellular, game_of_life };
  (generators[algo] || generators.dla)(ctx, W, H, rng, canvas);
}

function dla(ctx, W, H, rng, canvas) {
  // Diffusion-limited aggregation — frost crystal
  const scale = 2;
  const gw = Math.floor(W / scale), gh = Math.floor(H / scale);
  const grid = new Uint8Array(gw * gh);
  // Seed center
  grid[Math.floor(gh / 2) * gw + Math.floor(gw / 2)] = 1;

  let particles = [];
  for (let i = 0; i < 3000; i++) {
    particles.push({ x: Math.floor(rng() * gw), y: Math.floor(rng() * gh), age: 0 });
  }

  let frame = 0;
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { canvas._visible = e.isIntersecting; });
  }, { threshold: 0.1 });
  observer.observe(canvas);
  canvas._visible = true;

  function step() {
    if (!canvas._visible) { requestAnimationFrame(step); return; }
    let settled = 0;
    for (let iter = 0; iter < 20; iter++) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += Math.floor(rng() * 3) - 1;
        p.y += Math.floor(rng() * 3) - 1;
        p.x = (p.x + gw) % gw;
        p.y = (p.y + gh) % gh;
        p.age++;

        // Check neighbors
        const idx = p.y * gw + p.x;
        let neighbor = false;
        for (let dy = -1; dy <= 1 && !neighbor; dy++) {
          for (let dx = -1; dx <= 1 && !neighbor; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = p.x + dx, ny = p.y + dy;
            if (nx >= 0 && nx < gw && ny >= 0 && ny < gh && grid[ny * gw + nx]) neighbor = true;
          }
        }
        if (neighbor) {
          grid[idx] = 1;
          // Draw pixel
          const dist = Math.sqrt((p.x - gw/2)**2 + (p.y - gh/2)**2) / (gw/2);
          const hue = 140 + dist * 80; // green → teal
          const light = 60 + (1 - dist) * 20;
          ctx.fillStyle = `hsl(${hue}, 50%, ${light}%)`;
          ctx.fillRect(p.x * scale, p.y * scale, scale, scale);
          particles.splice(i, 1);
          settled++;
          // Spawn replacement at edge
          const side = Math.floor(rng() * 4);
          let nx, ny;
          if (side === 0) { nx = Math.floor(rng() * gw); ny = 0; }
          else if (side === 1) { nx = Math.floor(rng() * gw); ny = gh - 1; }
          else if (side === 2) { nx = 0; ny = Math.floor(rng() * gh); }
          else { nx = gw - 1; ny = Math.floor(rng() * gh); }
          particles.push({ x: nx, y: ny, age: 0 });
        }
      }
    }
    frame++;
    if (frame < 2000) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function flow_field(ctx, W, H, rng, canvas) {
  // Perlin-like flow field with particle trails
  const res = 20;
  const cols = Math.ceil(W / res), rows = Math.ceil(H / res);
  // Simple noise grid
  const angles = [];
  for (let i = 0; i < cols * rows; i++) angles.push(rng() * Math.PI * 4);
  // Smooth it
  for (let pass = 0; pass < 3; pass++) {
    for (let y = 1; y < rows - 1; y++) {
      for (let x = 1; x < cols - 1; x++) {
        const i = y * cols + x;
        angles[i] = (angles[i] + angles[i-1] + angles[i+1] + angles[i-cols] + angles[i+cols]) / 5;
      }
    }
  }

  const particles = [];
  for (let i = 0; i < 800; i++) {
    particles.push({ x: rng() * W, y: rng() * H, life: 100 + rng() * 200 });
  }

  ctx.globalAlpha = 0.4;
  let frame = 0;
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { canvas._visible = e.isIntersecting; });
  }, { threshold: 0.1 });
  observer.observe(canvas);
  canvas._visible = true;

  function step() {
    if (!canvas._visible) { requestAnimationFrame(step); return; }
    // Fade
    ctx.globalAlpha = 0.01;
    ctx.fillStyle = GARDEN_COLORS.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.6;

    for (const p of particles) {
      const col = Math.floor(p.x / res), row = Math.floor(p.y / res);
      if (col >= 0 && col < cols && row >= 0 && row < rows) {
        const angle = angles[row * cols + col] + frame * 0.002;
        p.x += Math.cos(angle) * 1.5;
        p.y += Math.sin(angle) * 1.5;
      }
      p.life--;
      if (p.life <= 0 || p.x < 0 || p.x > W || p.y < 0 || p.y > H) {
        p.x = rng() * W; p.y = rng() * H; p.life = 100 + rng() * 200;
      }
      const t = p.life / 300;
      ctx.fillStyle = t > 0.5 ? GARDEN_COLORS.growth : GARDEN_COLORS.glow;
      ctx.fillRect(p.x, p.y, 2, 2);
    }
    frame++;
    if (frame < 3000) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function cellular(ctx, W, H, rng) {
  // Rule 110 cellular automaton, row by row
  const scale = 3;
  const cols = Math.floor(W / scale);
  const rule = 110;
  let row = new Uint8Array(cols);
  row[Math.floor(cols / 2)] = 1; // single seed
  for (let i = 0; i < cols; i++) if (rng() < 0.01) row[i] = 1; // sprinkle

  let y = 0;
  const maxRows = Math.floor(H / scale);
  const colors = [GARDEN_COLORS.bg, GARDEN_COLORS.growth, GARDEN_COLORS.glow, GARDEN_COLORS.accent];

  function drawRow() {
    for (let x = 0; x < cols; x++) {
      if (row[x]) {
        const ci = (x + y) % 3 + 1;
        ctx.fillStyle = colors[ci];
        ctx.fillRect(x * scale, y * scale, scale, scale);
      }
    }
    const next = new Uint8Array(cols);
    for (let x = 0; x < cols; x++) {
      const l = row[(x - 1 + cols) % cols], c = row[x], r = row[(x + 1) % cols];
      const pattern = (l << 2) | (c << 1) | r;
      next[x] = (rule >> pattern) & 1;
    }
    row = next;
    y++;
    if (y < maxRows) setTimeout(drawRow, 25);
  }
  drawRow();
}

function game_of_life(ctx, W, H, rng, canvas) {
  const scale = 4;
  const gw = Math.floor(W / scale), gh = Math.floor(H / scale);
  let grid = new Uint8Array(gw * gh);
  // Random seed ~25%
  for (let i = 0; i < grid.length; i++) grid[i] = rng() < 0.25 ? 1 : 0;

  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { canvas._visible = e.isIntersecting; });
  }, { threshold: 0.1 });
  observer.observe(canvas);
  canvas._visible = true;

  let gen = 0;
  function step() {
    if (!canvas._visible) { requestAnimationFrame(step); return; }
    ctx.fillStyle = GARDEN_COLORS.bg;
    ctx.fillRect(0, 0, W, H);

    const next = new Uint8Array(gw * gh);
    for (let y = 0; y < gh; y++) {
      for (let x = 0; x < gw; x++) {
        let n = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = (x + dx + gw) % gw, ny = (y + dy + gh) % gh;
          n += grid[ny * gw + nx];
        }
        const alive = grid[y * gw + x];
        next[y * gw + x] = alive ? (n === 2 || n === 3 ? 1 : 0) : (n === 3 ? 1 : 0);
        if (next[y * gw + x]) {
          ctx.fillStyle = alive ? GARDEN_COLORS.growth : GARDEN_COLORS.glow;
          ctx.fillRect(x * scale, y * scale, scale - 1, scale - 1);
        }
      }
    }
    grid = next;
    gen++;
    if (gen < 1000) setTimeout(() => requestAnimationFrame(step), 80);
  }
  requestAnimationFrame(step);
}

// Set date
document.getElementById('date').textContent = formatDate(new Date());

// Load feed
loadFeed();

// Refresh every 5 minutes
setInterval(loadFeed, 5 * 60 * 1000);

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
