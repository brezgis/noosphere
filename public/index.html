<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noosphere</title>
<meta name="description" content="A personal feed with nobody else in it.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#e7e2f0" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Pick day or night before first paint. "sun" follows the last sunrise and
  // sunset the weather stream reported, which app.js leaves in local storage.
  (function () {
    var light = 'sun', sun = [390, 1080];
    try {
      light = JSON.parse(localStorage.getItem('noosphere.light')) || 'sun';
      sun = JSON.parse(localStorage.getItem('noosphere.sun')) || sun;
    } catch (e) {}
    var now = new Date(), m = now.getHours() * 60 + now.getMinutes();
    var theme = light === 'sun' ? (m >= sun[0] && m < sun[1] ? 'day' : 'night') : light;
    document.documentElement.setAttribute('data-theme', theme === 'night' ? 'night' : 'day');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip" href="#feed">Skip to the posts</a>

<header class="top">
  <div class="top-in">
    <a class="wordmark" href="#/" aria-label="noosphere, back to today">
      <span aria-hidden="true">n</span><svg viewBox="0 0 37 22" aria-hidden="true"><circle class="wm-sun" cx="11" cy="11" r="9.5"/><circle class="wm-ring" cx="26" cy="11" r="9.5"/></svg><span aria-hidden="true">sphere</span>
    </a>
    <nav class="tabs" aria-label="Views">
      <a href="#/" data-tab="feed">Today</a>
      <a href="#/kept" data-tab="likes">Kept</a>
      <a href="#/archive" data-tab="archive">Archive</a>
      <a href="#/random" data-tab="random" title="Open a post at random">Random</a>
    </nav>
    <form class="search" id="searchForm" role="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 10l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search" aria-label="Search the feed" autocomplete="off">
    </form>
    <button id="menuBtn" type="button" aria-label="Streams and settings" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
</header>

<div class="layout">
  <main id="feed" class="col" tabindex="-1">
    <div id="notice" class="notice" hidden></div>
    <button id="newPosts" class="newposts" type="button" hidden></button>
    <div id="posts" aria-live="polite"></div>
    <div id="sentinel" aria-hidden="true"></div>
    <p id="end" class="end" hidden></p>
  </main>

  <aside id="sidebar" class="side" aria-label="Streams and settings"></aside>
</div>
<div id="scrim" class="scrim" hidden></div>

<button id="toTop" class="totop" type="button" hidden>Back to top</button>

<script src="/garden.js"></script>
<script src="/app.js"></script>
</body>
</html>
