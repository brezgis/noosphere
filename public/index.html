<!doctype html>
<html lang="en" data-theme="dashboard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noosphere.</title>
<meta name="description" content="A personal feed with nobody else in it.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2f4760" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Apply the saved theme before first paint.
  try {
    var t = localStorage.getItem('noosphere.theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip" href="#feed">Skip to the posts</a>

<header class="top">
  <div class="top-in">
    <a class="wordmark" href="#/" aria-label="noosphere, back to the dashboard">noosphere.</a>
    <form class="search" id="searchForm" role="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 10l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search the feed" aria-label="Search the feed" autocomplete="off">
    </form>
    <nav class="tabs" aria-label="Views">
      <a href="#/" data-tab="feed" title="Dashboard" aria-label="Dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z"/></svg></a>
      <a href="#/likes" data-tab="likes" title="Likes" aria-label="Likes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.800-8 11-8 11z"/></svg></a>
      <a href="#/archive" data-tab="archive" title="Archive" aria-label="Archive"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg></a>
      <a href="#/random" data-tab="random" title="A random post" aria-label="A random post"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.500c5 0 6 10 11 10H21M3 17h3.500c1.700 0 2.900-1.100 4-2.600M21 7h-3.500c-1.700 0-2.900 1.100-4 2.600" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"/><path d="m18.500 4 3 3-3 3M18.500 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <button id="menuBtn" type="button" aria-label="About this feed and its streams" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"/></svg></button>
    </nav>
  </div>
</header>

<div class="layout">
  <main id="feed" class="col" tabindex="-1">
    <div class="composer">
      <span class="avatar me" id="meAvatar" aria-hidden="true"></span>
      <nav class="typebar" id="typebar" aria-label="Filter by post type"></nav>
    </div>
    <div id="notice" class="notice" hidden></div>
    <button id="newPosts" class="newposts" type="button" hidden></button>
    <div id="posts" aria-live="polite"></div>
    <div id="sentinel" aria-hidden="true"></div>
    <p id="end" class="end" hidden></p>
  </main>

  <aside id="sidebar" class="side" aria-label="About this feed"></aside>
</div>
<div id="scrim" class="scrim" hidden></div>

<button id="toTop" class="totop" type="button" hidden>Back to top</button>

<script src="/garden.js"></script>
<script src="/app.js"></script>
</body>
</html>
